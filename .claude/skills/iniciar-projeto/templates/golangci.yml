version: "2"
linters:
  enable:
    - gosec
    - errorlint
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]
formatters:
  enable: [gofmt]
